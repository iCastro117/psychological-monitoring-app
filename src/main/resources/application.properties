# ─── Servidor ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/
spring.application.name=Monitoreo-Psicologico-USAR

# ─── Base de datos PostgreSQL ─────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/usar_monitoreo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ─── Correo electrónico (Gmail SMTP) ─────────────────────────────────────────
# MAIL_USERNAME = la cuenta Gmail que enviará los códigos OTP
# MAIL_PASSWORD = la "Contraseña de aplicación" de 16 caracteres (NO tu contraseña normal)
# Cómo obtenerla: myaccount.google.com > Seguridad > Contraseñas de aplicación
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:configurar_en_render@gmail.com}
spring.mail.password=${MAIL_PASSWORD:configurar_en_render}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─── Codificación y recursos estáticos ───────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ─── Jackson JSON ─────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Bogota

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.usar.monitoreo=DEBUG
logging.level.org.springframework.mail=DEBUG

# ─── Error handling ───────────────────────────────────────────────────────────
server.error.include-message=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
