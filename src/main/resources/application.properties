# ─── Servidor ────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/
spring.application.name=Monitoreo-Psicologico-USAR

# ─── Base de datos PostgreSQL ─────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/usar_monitoreo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ─── Correo electrónico (Brevo API — NO SMTP) ────────────────────────────────
# Render bloquea los puertos SMTP (25, 465, 587) en el plan gratuito desde
# septiembre de 2025. Por eso usamos la API HTTP de Brevo en su lugar,
# que viaja por HTTPS (puerto 443) y nunca está bloqueada.
#
# BREVO_API_KEY    = tu clave API de https://app.brevo.com/settings/keys/api
# BREVO_SENDER_EMAIL = el correo que verificaste como remitente en Brevo
#                      (Senders, Domains & Dedicated IPs → Senders → Add a sender)
brevo.api.key=${BREVO_API_KEY:configurar_en_render}
brevo.sender.email=${BREVO_SENDER_EMAIL:configurar_en_render@gmail.com}

# ─── Sesión del dashboard ─────────────────────────────────────────────────────
# Clave con la que se firman los tokens de sesión (duran 2 horas exactas).
# Debe ser la MISMA entre reinicios: si cambia, todas las sesiones se cierran.
# En Railway defínela como variable de entorno SESSION_SECRET.
app.session.secret=${SESSION_SECRET:usar-col13-monitoreo-clave-firma-sesion}

# ─── Codificación y recursos estáticos ───────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ─── Jackson JSON ─────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=America/Bogota

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.usar.monitoreo=DEBUG

# ─── Error handling ───────────────────────────────────────────────────────────
server.error.include-message=always
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
